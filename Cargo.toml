[package]
name = "dub-assistant"
version = "0.1.2"
edition = "2021"
description = "DubAssistant - App desktop nativo em Rust para extração, organização e upload de dublagens no CapybaraBR"

[lib]
name = "dub_assistant"
path = "src/lib.rs"

[[bin]]
name = "DubAssistant"
path = "src/main.rs"

[[bin]]
name = "dubassistant-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
eframe = "0.29"
egui = "0.29"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "gzip", "brotli", "cookies", "rustls-tls"] }
rfd = "0.15"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
thiserror = "2.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "time", "fs", "signal"] }
url = "2.5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
